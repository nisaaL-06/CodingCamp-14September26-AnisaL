<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <div class="app-wrapper">

    <!-- Header -->
    <header class="app-header">
      <h1>💰 Budget Visualizer</h1>
      <p class="subtitle">Track your spending in one place</p>
    </header>

    <!-- Total Spending Card -->
    <section class="balance-card">
      <p class="balance-label">Total Spending</p>
      <h2 class="balance-amount" id="totalBalance">Rp 0</h2>
    </section>

    <!-- Add Transaction Form -->
    <section class="card form-card">
      <h3>Add Transaction</h3>
      <div class="form-group">
        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" placeholder="e.g. Lunch, Bus ride…" autocomplete="off" />
        <p class="error-msg field-error" id="errorName"></p>
      </div>
      <div class="form-group">
        <label for="amount">Amount (Rp)</label>
        <input type="number" id="amount" placeholder="e.g. 25000" min="0" />
        <p class="error-msg field-error" id="errorAmount"></p>
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category">
          <option value="Food">🍔 Food</option>
          <option value="Transport">🚌 Transport</option>
          <option value="Fun">🎮 Fun</option>
        </select>
      </div>
      <button class="btn-add" id="addBtn">Add Expense</button>
    </section>

    <!-- Pie Chart -->
    <section class="card chart-card">
      <h3>Spending by Category</h3>
      <div class="chart-container">
        <canvas id="pieChart"></canvas>
      </div>
      <p class="no-data-msg" id="noDataMsg">No expense data yet.</p>
    </section>

    <!-- Transaction List -->
    <section class="card list-card">
      <div class="list-header">
        <h3>Transactions</h3>
        <button class="btn-clear" id="clearAllBtn">Clear All</button>
      </div>
      <ul class="transaction-list" id="transactionList">
        <!-- populated by JS -->
      </ul>
      <p class="empty-msg" id="emptyMsg">No transactions yet. Add one above!</p>
    </section>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
